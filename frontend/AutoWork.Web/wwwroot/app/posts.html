<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bài viết đơn - FlowMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/demo.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    if (!Auth.requireAuth()) throw new Error('auth');
    renderAppLayout('/app/posts.html');
    setPageTitle('Tạo bài viết đơn', `<button class="btn-primary btn-sm" onclick="createNewPost()"><i class="bi bi-plus"></i> Bài viết mới</button>`);

    let posts = [];
    let currentPage = 1;
    let selectedPost = null;
    let selectedImages = [];

    async function loadPosts() {
      setPageContent('<div class="empty-state">Đang tải danh sách bài viết...</div>');
      try {
        const json = await apiGet(`/api/Posts?page=${currentPage}&pageSize=10`);
        if (!json.success) throw new Error(json.message || 'Không tải được bài viết');
        posts = json.data?.items || [];
        if (!selectedPost || !posts.some(p => p.id === selectedPost.id)) {
          selectedPost = posts.length ? { ...posts[0] } : createDraft();
        }
        renderComposer();
      } catch (e) {
        setPageContent(`<div class="empty-state">Lỗi: ${e.message}</div>`);
      }
    }

    function createDraft() {
      return {
        id: null,
        title: '',
        content: '',
        status: 0,
        createdAt: new Date().toISOString(),
        isDraftLocal: true
      };
    }

    function createNewPost() {
      selectedPost = createDraft();
      selectedImages = [];
      renderComposer();
    }

    function selectPost(id) {
      const p = posts.find(x => x.id === id);
      if (!p) return;
      selectedPost = { ...p, content: '' };
      selectedImages = [];
      renderComposer();
    }

    function renderComposer() {
      const p = selectedPost || createDraft();
      const options = posts.map(x => `
        <div onclick="selectPost('${x.id}')" style="cursor:pointer;border:1px solid ${p.id === x.id ? '#bdb5ff' : '#e8ebf6'};background:${p.id === x.id ? '#f6f4ff' : '#fff'};padding:10px;border-radius:12px;">
          <div style="font-size:.78rem;color:#8f95aa">${formatDate(x.createdAt)}</div>
          <div style="font-weight:600;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${x.title || 'Không tiêu đề'}</div>
          <span class="badge ${postStatusClass(x.status)}">${postStatusLabel(x.status)}</span>
        </div>`).join('');

      setPageContent(`
        <div style="display:grid;grid-template-columns:260px 1fr 340px;gap:12px;align-items:start;">
          <div class="data-card" style="padding:10px;display:grid;gap:8px;max-height:72vh;overflow:auto;">
            <div style="font-size:.92rem;font-weight:700;color:#525a73">Bài viết gần đây</div>
            ${options || '<div class="empty-state">Chưa có bài viết</div>'}
          </div>

          <div class="data-card" style="padding:14px;">
            <div class="form-group">
              <label>Bài viết hiển thị</label>
              <div class="action-bar">
                <button class="btn-outline btn-sm">Facebook</button>
                <button class="btn-outline btn-sm">Instagram</button>
                <button class="btn-outline btn-sm">Thêm nền tảng</button>
              </div>
            </div>

            <div class="form-group">
              <label for="pTitle">Tiêu đề</label>
              <input id="pTitle" class="form-control" value="${escapeHtml(p.title || '')}" />
            </div>

            <div class="form-group">
              <label for="pContent">Nội dung bài viết</label>
              <textarea id="pContent" class="form-control" placeholder="Nhập nội dung...">${escapeHtml(p.content || '')}</textarea>
            </div>

            <div class="action-bar" style="margin-bottom:10px;">
              <button class="btn-outline btn-sm"><i class="bi bi-lightning-charge"></i> Gợi ý nội dung</button>
              <button class="btn-outline btn-sm"><i class="bi bi-hash"></i> Thêm hashtag</button>
              <button class="btn-outline btn-sm"><i class="bi bi-emoji-smile"></i> Thêm emoji</button>
              <button class="btn-outline btn-sm"><i class="bi bi-magic"></i> Viết lại</button>
            </div>

            <div class="form-group">
              <label>Hình ảnh / Video</label>
              <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;" id="imageList"></div>
              <label class="btn-outline w-100" style="margin-top:8px;text-align:center;cursor:pointer;">
                <i class="bi bi-plus-lg"></i> Thêm ảnh
                <input id="imgPicker" type="file" accept="image/*" multiple style="display:none" />
              </label>
            </div>

            <div class="form-group">
              <label for="hashtags">Hashtag</label>
              <input id="hashtags" class="form-control" value="#FlowMate #Fashion #Summer2025" />
            </div>

            <div class="form-group">
              <label>Giọng văn</label>
              <div style="display:grid;gap:8px;">
                ${[
                  'Hàng mới về nè cả nhà ơi, xinh xỉu luôn á',
                  'Bộ sưu tập mới đã có mặt tại cửa hàng',
                  'Chào đón thiết kế mới, tinh giản và hiện đại',
                  'Form dáng chuẩn, chất liệu bền, dễ phối'
                ].map((t, i) => `
                  <label style="display:flex;gap:8px;align-items:flex-start;padding:9px;border:1px solid #e5e8f4;border-radius:10px;background:${i === 0 ? '#f1efff' : '#fff'};">
                    <input type="radio" name="tone" ${i === 0 ? 'checked' : ''} />
                    <span style="font-size:.9rem">${t}</span>
                  </label>
                `).join('')}
              </div>
            </div>

            <div class="action-bar">
              <button class="btn-primary" onclick="savePost()"><i class="bi bi-save"></i> Lưu bài viết</button>
              <button class="btn-success" onclick="publishPost()"><i class="bi bi-send"></i> Đăng bài</button>
              <button class="btn-outline" onclick="schedulePost()"><i class="bi bi-clock"></i> Lên lịch</button>
              ${p.id ? `<button class="btn-danger" onclick="deletePost()"><i class="bi bi-trash"></i> Xóa</button>` : ''}
            </div>
          </div>

          <div class="data-card" style="padding:14px;position:sticky;top:72px;">
            <div style="font-weight:700;margin-bottom:10px;">Xem trước bài viết</div>
            <div style="border:1px solid #e8ebf6;border-radius:12px;padding:12px;">
              <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;">
                <div style="width:36px;height:36px;border-radius:50%;background:#6156f4;"></div>
                <div>
                  <div style="font-weight:700">FlowMate Store</div>
                  <div style="font-size:.78rem;color:#8f95aa">Vừa xong</div>
                </div>
              </div>
              <div id="previewTitle" style="font-weight:700;margin-bottom:8px;">${escapeHtml(p.title || 'Tiêu đề bài viết')}</div>
              <div id="previewContent" style="white-space:pre-wrap;color:#4f566f;">${escapeHtml(p.content || 'Nội dung xem trước sẽ hiển thị ở đây...')}</div>
              <div id="previewImages" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;"></div>
              <div style="margin-top:10px;font-size:.78rem;color:#8f95aa;">
                <i class="bi bi-calendar-check"></i> ${p.createdAt ? formatDate(p.createdAt) : 'Chưa chọn lịch đăng'}
              </div>
            </div>
          </div>
        </div>
      `);

      document.getElementById('pTitle')?.addEventListener('input', updatePreview);
      document.getElementById('pContent')?.addEventListener('input', updatePreview);
      document.getElementById('imgPicker')?.addEventListener('change', onPickImages);
      renderImages();
      updatePreview();
    }

    function escapeHtml(str) {
      return String(str || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function onPickImages(e) {
      const files = Array.from(e.target.files || []);
      for (const file of files) {
        if (selectedImages.length >= 4) break;
        selectedImages.push({ id: crypto.randomUUID(), url: URL.createObjectURL(file), name: file.name });
      }
      renderImages();
      updatePreview();
    }

    function removeImage(id) {
      selectedImages = selectedImages.filter(i => i.id !== id);
      renderImages();
      updatePreview();
    }

    function renderImages() {
      const list = document.getElementById('imageList');
      if (!list) return;
      list.innerHTML = selectedImages.length
        ? selectedImages.map(i => `
          <div style="position:relative;border:1px solid #e8ebf6;border-radius:10px;overflow:hidden;">
            <img src="${i.url}" alt="${i.name}" style="width:100%;height:70px;object-fit:cover" />
            <button class="btn-danger btn-sm" style="position:absolute;top:4px;right:4px;padding:1px 5px;" onclick="removeImage('${i.id}')">x</button>
          </div>
        `).join('')
        : '<div class="empty-state" style="grid-column:1/-1;padding:12px;">Chưa có ảnh</div>';
    }

    function updatePreview() {
      const t = document.getElementById('pTitle')?.value || 'Tiêu đề bài viết';
      const c = document.getElementById('pContent')?.value || 'Nội dung xem trước sẽ hiển thị ở đây...';
      const pTitle = document.getElementById('previewTitle');
      const pContent = document.getElementById('previewContent');
      const pImgs = document.getElementById('previewImages');
      if (pTitle) pTitle.textContent = t;
      if (pContent) pContent.textContent = c;
      if (pImgs) {
        pImgs.innerHTML = selectedImages.length
          ? selectedImages.map(i => `<img src="${i.url}" style="width:100%;height:88px;object-fit:cover;border-radius:10px;" />`).join('')
          : '';
      }
    }

    async function savePost() {
      const title = document.getElementById('pTitle')?.value?.trim();
      const content = document.getElementById('pContent')?.value?.trim();
      if (!title || !content) return showToast('Nhập tiêu đề và nội dung trước khi lưu', 'error');

      const body = {
        projectId: DEMO.PROJECT_ID,
        channelAccountId: DEMO.CHANNEL_FB,
        title,
        content,
        contentType: 1
      };

      try {
        const json = selectedPost?.id
          ? await apiPut(`/api/Posts/${selectedPost.id}`, body)
          : await apiPost('/api/Posts', body);

        if (json.success) {
          showToast(selectedPost?.id ? 'Đã cập nhật bài viết' : 'Đã tạo bài viết', 'success');
          await loadPosts();
        } else {
          showToast(json.message || 'Lưu bài thất bại', 'error');
        }
      } catch (e) {
        showToast('Lỗi lưu bài viết: ' + e.message, 'error');
      }
    }

    function publishPost() {
      if (!selectedPost?.id) return showToast('Lưu bài trước khi đăng', 'error');
      confirmAction('Đăng bài lên kênh đã chọn ngay?', async () => {
        showToast('Demo: Đang đăng bài...', 'info');
        await new Promise(r => setTimeout(r, 900));
        showToast('Đã đăng bài thành công!', 'success');
        DemoStore.addNotification('Đăng bài', selectedPost.title || 'Bài viết', 'post');
      });
    }

    function schedulePost() {
      if (!selectedPost?.id) return showToast('Lưu bài trước khi lên lịch', 'error');
      showModal('Lên lịch đăng', `
        <div class="form-group">
          <label>Thời gian đăng</label>
          <input id="schAt" type="datetime-local" class="form-control" />
        </div>
      `, `
        <button class="btn-outline btn-sm" onclick="closeModal()">Hủy</button>
        <button class="btn-primary btn-sm" id="doSchedule">Xác nhận</button>
      `);
      document.getElementById('doSchedule')?.addEventListener('click', async () => {
        const t = document.getElementById('schAt').value;
        if (!t) return showToast('Chọn thời gian', 'error');
        const json = await apiPost('/api/Schedules', {
          postId: selectedPost.id,
          scheduledAt: new Date(t).toISOString(),
          recurrenceType: 0
        });
        closeModal();
        if (json.success) {
          showToast('Đã lên lịch', 'success');
          await loadPosts();
        } else {
          showToast(json.message || 'Lên lịch thất bại', 'error');
        }
      });
    }

    function deletePost() {
      if (!selectedPost?.id) return;
      confirmAction('Xóa bài viết này?', async () => {
        const json = await apiDelete(`/api/Posts/${selectedPost.id}`);
        if (json.success) {
          showToast('Đã xóa bài viết', 'success');
          selectedPost = null;
          await loadPosts();
        } else {
          showToast(json.message || 'Xóa thất bại', 'error');
        }
      });
    }

    if (new URLSearchParams(location.search).get('action') === 'create') {
      selectedPost = createDraft();
    }

    loadPosts();
  </script>
</body>
</html>
