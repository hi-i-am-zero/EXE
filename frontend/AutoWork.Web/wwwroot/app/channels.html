<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kết nối kênh - FlowMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <script src="/js/api.js?v=3"></script>
  <script src="/js/auth.js?v=3"></script>
  <script src="/js/demo.js"></script>
  <script src="/js/layout.js?v=3"></script>
  <script>
    if (!Auth.requireAuth()) throw new Error('auth');
    renderAppLayout('/app/channels.html');
    setPageTitle('Kết nối kênh');

    let projects = [];
    let projectId = null;
    let facebookPages = [];

    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function redirectUri() {
      return `${location.origin}/app/channels.html`;
    }

    async function bootstrap() {
      const p = await apiGet('/api/workspace/projects');
      if (!p.success || !(p.data || []).length) {
        return setPageContent('<div class="empty-state">Chưa có workspace. Hãy tạo workspace trước trong trang Workspace.</div>');
      }
      projects = p.data;
      projectId = projectId || projects[0].id;

      // Xử lý callback OAuth Facebook: nếu URL có ?code=...&state=... nghĩa là vừa quay lại từ Facebook
      const qs = new URLSearchParams(location.search);
      const code = qs.get('code');
      const state = qs.get('state'); // "userId|projectId"
      if (code) {
        history.replaceState(null, '', location.pathname); // xoá query khỏi URL sau khi lấy được code
        const statedProjectId = state?.split('|')?.[1];
        await completeFacebookConnect(code, statedProjectId || projectId);
      }

      await loadFacebookPages();
    }

    async function loadFacebookPages() {
      const json = await apiGet('/api/facebook/pages');
      facebookPages = json.success ? json.data : [];
      renderPage();
    }

    function changeProject(id) {
      projectId = id;
      renderPage();
    }

    function renderPage() {
      setPageContent(`
        <div class="data-card" style="padding:14px;margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
            <div>
              <h3 style="margin:0;">Facebook Fanpage</h3>
              <p style="margin:4px 0 0;color:var(--color-text-muted,#8f95aa);font-size:.88rem;">
                Kết nối tài khoản Facebook để đăng bài tự động qua Graph API thật.
              </p>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
              <select class="form-control" style="min-width:220px" onchange="changeProject(this.value)">
                ${projects.map(p => `<option value="${p.id}" ${p.id === projectId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('')}
              </select>
              <button class="btn-primary btn-sm" onclick="startFacebookConnect()"><i class="bi bi-facebook"></i> Kết nối Facebook</button>
            </div>
          </div>

          <div style="margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;">
            ${facebookPages.length ? facebookPages.map(page => `
              <div style="border:1px solid #e7eaf6;border-radius:12px;padding:12px;background:#fff;">
                <div style="font-weight:700;">${escapeHtml(page.pageName)}</div>
                <div style="font-size:.78rem;color:#8f95aa;">${escapeHtml(page.category || '')}</div>
                <span class="badge ${page.isActive ? 'badge-success' : 'badge-secondary'}" style="margin-top:6px;display:inline-block;">
                  ${page.isActive ? 'Đã đồng bộ — sẵn sàng đăng bài' : 'Ngừng hoạt động'}
                </span>
              </div>
            `).join('') : '<div class="empty-state">Chưa có Fanpage nào được kết nối.</div>'}
          </div>
          <p style="font-size:.78rem;color:#8f95aa;margin-top:10px;">
            Sau khi kết nối, các Fanpage này sẽ tự động xuất hiện trong danh sách "Nền tảng đăng"
            ở trang Tạo bài viết đơn / Chiến dịch tự động.
          </p>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;">
          <div class="data-card" style="padding:14px;text-align:center;opacity:.6;">
            <i class="bi bi-wordpress" style="font-size:1.8rem;"></i>
            <h3 style="margin:8px 0 4px;">WordPress / WooCommerce</h3>
            <span class="badge badge-secondary">Sắp ra mắt</span>
          </div>
          <div class="data-card" style="padding:14px;text-align:center;opacity:.6;">
            <i class="bi bi-chat-dots" style="font-size:1.8rem;"></i>
            <h3 style="margin:8px 0 4px;">Zalo Official Account</h3>
            <span class="badge badge-secondary">Sắp ra mắt</span>
          </div>
        </div>
      `);
    }

    async function startFacebookConnect() {
      const json = await apiGet(`/api/facebook/connect?projectId=${projectId}&redirectUri=${encodeURIComponent(redirectUri())}`);
      if (json.success && json.data?.url) {
        location.href = json.data.url;
      } else {
        showToast(json.message || 'Không tạo được liên kết Facebook. Kiểm tra cấu hình FacebookSettings (AppId/AppSecret).', 'error');
      }
    }

    async function completeFacebookConnect(code, forProjectId) {
      showToast('Đang hoàn tất kết nối Facebook...', 'info');
      const json = await apiPost('/api/facebook/connect', {
        projectId: forProjectId,
        code,
        redirectUri: redirectUri()
      });
      if (json.success) {
        showToast(`Đã kết nối Facebook: ${json.data?.name || ''}`, 'success');
      } else {
        showToast(json.message || 'Kết nối Facebook thất bại.', 'error');
      }
    }

    bootstrap();
  </script>
</body>
</html>
