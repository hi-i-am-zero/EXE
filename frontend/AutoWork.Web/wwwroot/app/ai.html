<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Content - FlowMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/demo.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    if (!Auth.requireAuth()) throw new Error('auth');
    renderAppLayout('/app/ai.html');
    setPageTitle('AI tạo mô tả sản phẩm (bổ sung)');

    let prompts = [];
    let uploadedImages = [];
    let lastResult = null;

    async function loadPage() {
      try {
        const pJson = await apiGet('/api/Ai/prompts');
        prompts = pJson.data || [];
      } catch {
        prompts = [];
      }

      setPageContent(`
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="data-card" style="padding:16px;">
            <h3 style="margin-bottom:6px;">Sản phẩm của bạn</h3>
            <p style="margin-bottom:12px;">AI sẽ phân tích sản phẩm và tạo mô tả hấp dẫn, chuẩn SEO theo giọng thương hiệu.</p>

            <div class="form-group">
              <label>Chủ đề / Tên sản phẩm</label>
              <input id="aiTopic" class="form-control" placeholder="Ví dụ: Áo thun Explore Evolve" value="Áo thun Explore Evolve" />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Kênh đích</label>
                <select id="aiChannel" class="form-control">
                  <option value="facebook">Facebook</option>
                  <option value="wordpress">WordPress</option>
                  <option value="zalo">Zalo OA</option>
                  <option value="seo">SEO Blog</option>
                </select>
              </div>
              <div class="form-group">
                <label>Giọng văn</label>
                <select id="aiTone" class="form-control">
                  <option>Trẻ trung</option>
                  <option>Thân thiện</option>
                  <option>Chuyên nghiệp</option>
                  <option>Tối giản</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Prompt template</label>
              <select id="aiPrompt" class="form-control">
                <option value="">- Tự động -</option>
                ${prompts.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
              </select>
            </div>

            <div class="form-group">
              <label>Ảnh sản phẩm (tối đa 4)</label>
              <div id="uploadedList" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:8px;"></div>
              <label class="btn-outline w-100" style="display:block;text-align:center;cursor:pointer;">
                <i class="bi bi-plus-lg"></i> Thêm ảnh sản phẩm
                <input id="imgPicker" type="file" accept="image/*" multiple style="display:none" />
              </label>
            </div>

            <div class="action-bar">
              <button class="btn-primary" id="btnGenerate"><i class="bi bi-stars"></i> Tạo mô tả</button>
              <button class="btn-outline" id="btnAddPrompt"><i class="bi bi-plus-circle"></i> Thêm prompt</button>
              <button class="btn-outline" onclick="switchTab('history')"><i class="bi bi-clock-history"></i> Xem lịch sử</button>
            </div>
          </div>

          <div class="data-card" style="padding:16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
              <h3>Mô tả sản phẩm do AI tạo</h3>
              <button class="btn-outline btn-sm" id="btnCopy"><i class="bi bi-clipboard"></i> Sao chép mô tả</button>
            </div>
            <div id="aiResult" class="ai-output" style="min-height:320px;">Nhấn "Tạo mô tả" để bắt đầu.</div>
            <div class="action-bar" style="margin-top:10px;">
              <button class="btn-primary w-100" id="btnToPost"><i class="bi bi-arrow-right-circle"></i> Tiếp tục tạo bài viết</button>
            </div>
          </div>
        </div>

        <div class="data-card" style="padding:14px;">
          <div class="tabs">
            <button id="tabPromptsBtn" class="tab-btn active" onclick="switchTab('prompts')">Prompt cá nhân</button>
            <button id="tabHistoryBtn" class="tab-btn" onclick="switchTab('history')">Lịch sử AI</button>
          </div>
          <div id="tabPrompts" class="tab-panel active"></div>
          <div id="tabHistory" class="tab-panel"></div>
        </div>
      `);

      document.getElementById('imgPicker')?.addEventListener('change', onSelectImages);
      document.getElementById('btnGenerate')?.addEventListener('click', generateAi);
      document.getElementById('btnCopy')?.addEventListener('click', copyResult);
      document.getElementById('btnToPost')?.addEventListener('click', createPostFromAi);
      document.getElementById('btnAddPrompt')?.addEventListener('click', showAddPrompt);

      renderImageList();
      renderPrompts();
      await loadHistory();
    }

    function onSelectImages(e) {
      const files = Array.from(e.target.files || []);
      for (const file of files) {
        if (uploadedImages.length >= 4) break;
        uploadedImages.push({
          id: crypto.randomUUID(),
          name: file.name,
          url: URL.createObjectURL(file)
        });
      }
      renderImageList();
    }

    function renderImageList() {
      const el = document.getElementById('uploadedList');
      if (!el) return;
      if (!uploadedImages.length) {
        el.innerHTML = '<div class="empty-state" style="grid-column:1/-1;padding:16px;">Chưa có ảnh sản phẩm.</div>';
        return;
      }
      el.innerHTML = uploadedImages.map(i => `
        <div style="position:relative;border:1px solid #e6e9f5;border-radius:10px;overflow:hidden;background:#fff;">
          <img src="${i.url}" alt="${i.name}" style="width:100%;height:92px;object-fit:cover;" />
          <button class="btn-danger btn-sm" style="position:absolute;top:4px;right:4px;padding:2px 6px;" onclick="removeImage('${i.id}')">x</button>
        </div>
      `).join('');
    }

    function removeImage(id) {
      uploadedImages = uploadedImages.filter(i => i.id !== id);
      renderImageList();
    }

    async function generateAi() {
      const topic = document.getElementById('aiTopic').value.trim();
      if (!topic) return showToast('Nhập chủ đề sản phẩm', 'error');

      const btn = document.getElementById('btnGenerate');
      btn.disabled = true;
      btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Đang tạo...';

      const body = {
        topic,
        tone: document.getElementById('aiTone').value,
        length: 500,
        provider: 0,
        promptId: document.getElementById('aiPrompt').value || null,
        projectId: DEMO.PROJECT_ID
      };

      const channel = document.getElementById('aiChannel').value;
      const json = await tryApiOrDemo(
        () => apiPost('/api/Ai/generate', body),
        () => mockAiContent(topic, channel)
      );

      const data = json.data || json;
      lastResult = data;
      const content = (data.title ? data.title + '\n\n' : '') + (data.content || data.output || '') + (data.hashtags ? '\n\n' + data.hashtags : '');
      const out = document.getElementById('aiResult');
      out.className = 'ai-output' + (data.isDemo ? ' demo' : '');
      out.textContent = data.isDemo ? 'DEMO MODE\n\n' + content : content;
      DemoStore.addNotification('AI đã tạo mô tả', topic, 'info');

      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-stars"></i> Tạo mô tả';
      await loadHistory();
    }

    function copyResult() {
      const txt = document.getElementById('aiResult')?.textContent;
      if (!txt || txt.includes('Nhấn "Tạo mô tả"')) return showToast('Chưa có nội dung để sao chép', 'error');
      navigator.clipboard.writeText(txt);
      showToast('Đã sao chép mô tả', 'success');
    }

    async function createPostFromAi() {
      if (!lastResult) return showToast('Tạo mô tả trước khi tiếp tục', 'error');
      const title = lastResult.title || document.getElementById('aiTopic').value;
      const content = lastResult.content || lastResult.output || '';
      try {
        const json = await apiPost('/api/Posts', {
          projectId: DEMO.PROJECT_ID,
          channelAccountId: DEMO.CHANNEL_FB,
          title,
          content,
          contentType: 1
        });
        if (json.success) {
          showToast('Đã tạo bài viết từ AI', 'success');
          setTimeout(() => location.href = '/app/posts.html', 700);
        } else {
          showToast(json.message || 'Không tạo được bài viết', 'error');
        }
      } catch (e) {
        showToast('Lỗi tạo bài viết: ' + e.message, 'error');
      }
    }

    function showAddPrompt() {
      showModal('Thêm Prompt', `
        <div class="form-group"><label>Tên prompt</label><input id="pName" class="form-control" /></div>
        <div class="form-group"><label>Template</label><textarea id="pTpl" class="form-control" placeholder="Dùng {{topic}}, {{tone}}..."></textarea></div>
        <div class="form-group"><label>Danh mục</label><input id="pCat" class="form-control" value="Custom" /></div>
      `, `
        <button class="btn-outline btn-sm" onclick="closeModal()">Hủy</button>
        <button class="btn-primary btn-sm" id="savePrompt">Lưu</button>
      `);
      document.getElementById('savePrompt')?.addEventListener('click', async () => {
        const json = await apiPost('/api/Ai/prompts', {
          name: document.getElementById('pName').value,
          template: document.getElementById('pTpl').value,
          category: document.getElementById('pCat').value
        });
        closeModal();
        if (json.success) {
          showToast('Đã thêm prompt', 'success');
          await loadPage();
        } else {
          showToast(json.message || 'Không thêm được prompt', 'error');
        }
      });
    }

    async function deletePrompt(id) {
      confirmAction('Xóa prompt này?', async () => {
        const json = await apiDelete(`/api/Ai/prompts/${id}`);
        if (json.success) {
          showToast('Đã xóa prompt', 'success');
          await loadPage();
        } else {
          showToast(json.message || 'Không xóa được prompt', 'error');
        }
      });
    }

    function renderPrompts() {
      const container = document.getElementById('tabPrompts');
      if (!container) return;
      container.innerHTML = `
        <table class="data-table">
          <thead><tr><th>Tên</th><th>Danh mục</th><th>Loại</th><th></th></tr></thead>
          <tbody>
            ${prompts.length
              ? prompts.map(p => `<tr>
                <td>${p.name}</td>
                <td>${p.category || '—'}</td>
                <td><span class="badge ${p.isSystem ? 'badge-info' : 'badge-secondary'}">${p.isSystem ? 'Hệ thống' : 'Cá nhân'}</span></td>
                <td>${!p.isSystem ? `<button class="btn-danger btn-sm" onclick="deletePrompt('${p.id}')">Xóa</button>` : ''}</td>
              </tr>`).join('')
              : '<tr><td colspan="4" class="empty-state">Chưa có prompt</td></tr>'}
          </tbody>
        </table>
      `;
    }

    async function loadHistory() {
      const container = document.getElementById('tabHistory');
      if (!container) return;
      try {
        const json = await apiGet('/api/Ai/history?page=1&pageSize=10');
        const items = json.data?.items || [];
        container.innerHTML = `
          <table class="data-table">
            <thead><tr><th>Input</th><th>Tokens</th><th>Thời gian</th></tr></thead>
            <tbody>
              ${items.length
                ? items.map(h => `<tr>
                    <td>${(h.input || h.topic || '').slice(0, 70) || '—'}</td>
                    <td>${h.tokensUsed || '—'}</td>
                    <td>${formatDate(h.createdAt)}</td>
                  </tr>`).join('')
                : '<tr><td colspan="3" class="empty-state">Chưa có lịch sử</td></tr>'}
            </tbody>
          </table>
        `;
      } catch {
        container.innerHTML = '<div class="empty-state">Không tải được lịch sử AI.</div>';
      }
    }

    function switchTab(tab) {
      const promptsBtn = document.getElementById('tabPromptsBtn');
      const historyBtn = document.getElementById('tabHistoryBtn');
      const promptsTab = document.getElementById('tabPrompts');
      const historyTab = document.getElementById('tabHistory');
      if (!promptsBtn || !historyBtn || !promptsTab || !historyTab) return;
      promptsBtn.classList.toggle('active', tab === 'prompts');
      historyBtn.classList.toggle('active', tab === 'history');
      promptsTab.classList.toggle('active', tab === 'prompts');
      historyTab.classList.toggle('active', tab === 'history');
    }

    loadPage();
  </script>
</body>
</html>
