<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Xác nhận email - FlowMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-split">
      <div class="auth-left">
        <div class="auth-card" style="text-align:center;padding-bottom:28px">
          <a href="/" class="auth-brand" style="justify-content:center">
            <span class="auth-brand-icon">⚡</span> FlowMate
          </a>
          <div id="statusIcon" style="font-size:2.4rem;margin:12px 0">⏳</div>
          <h1 id="statusTitle">Đang xác nhận email...</h1>
          <p class="subtitle" id="statusMessage">Vui lòng đợi trong giây lát.</p>
          <div id="error" class="form-error" style="display:none;margin-top:12px"></div>
          <a href="/login.html" id="loginLink" class="btn-outline btn-sm auth-panel-hidden" style="margin-top:14px;display:inline-flex">Về trang đăng nhập</a>
        </div>
      </div>
      <div class="auth-right">
        <div style="max-width:460px;padding:26px;text-align:left">
          <h2 style="font-size:1.9rem;margin-bottom:12px">Chào mừng đến FlowMate</h2>
          <p style="color:rgba(255,255,255,.83)">Sau khi xác nhận email, bạn sẽ được chuyển vào dashboard để bắt đầu chiến dịch.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js?v=6"></script>
  <script src="/js/auth.js?v=6"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');

    async function verify() {
      const err = document.getElementById('error');
      const title = document.getElementById('statusTitle');
      const msg = document.getElementById('statusMessage');
      const icon = document.getElementById('statusIcon');

      if (!token) {
        icon.textContent = '⚠️';
        title.textContent = 'Link không hợp lệ';
        msg.textContent = 'Thiếu mã xác nhận. Hãy mở link từ email hoặc đăng ký lại.';
        document.getElementById('loginLink').classList.remove('auth-panel-hidden');
        return;
      }

      try {
        const json = await apiGet('/api/auth/verify-email?token=' + encodeURIComponent(token));

        if (json.success && json.data) {
          Auth.saveSession(json.data);
          icon.textContent = '✅';
          title.textContent = 'Xác nhận thành công!';
          msg.textContent = 'Đang chuyển đến dashboard...';
          setTimeout(() => { window.location.href = '/app/dashboard.html?welcome=1'; }, 900);
          return;
        }

        icon.textContent = '❌';
        title.textContent = 'Xác nhận thất bại';
        err.textContent = formatApiError(json, 'Link đã hết hạn hoặc không hợp lệ.');
        err.style.display = 'block';
        msg.textContent = 'Bạn có thể đăng ký lại hoặc gửi lại email xác nhận từ trang đăng ký.';
        document.getElementById('loginLink').classList.remove('auth-panel-hidden');
      } catch {
        icon.textContent = '❌';
        title.textContent = 'Không kết nối được API';
        msg.textContent = 'Hãy chạy AutoWork.API và thử lại.';
        document.getElementById('loginLink').classList.remove('auth-panel-hidden');
      }
    }

    verify();
  </script>
</body>
</html>
