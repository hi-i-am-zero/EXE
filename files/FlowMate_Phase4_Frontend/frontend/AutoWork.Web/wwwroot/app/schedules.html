<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chiến dịch tự động - FlowMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/demo.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    if (!Auth.requireAuth()) throw new Error('auth');
    renderAppLayout('/app/schedules.html');
    setPageTitle('Chiến dịch tự động');

    let projects = [];
    let projectId = null;
    let lookup = { goals: [], promotionTypes: [], timelineTemplateTypes: [] };
    let channelAccounts = [];
    let campaigns = [];
    let timelines = [];

    let selectedGoalId = null;
    let selectedPromoId = null;
    let selectedChannelIds = [];

    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    async function loadAll() {
      const p = await apiGet('/api/workspace/projects');
      if (!p.success || !(p.data || []).length) {
        return setPageContent('<div class="empty-state">Chưa có workspace. Hãy tạo workspace trước trong trang Workspace.</div>');
      }
      projects = p.data;
      projectId = projectId || projects[0].id;

      const lk = await apiGet('/api/campaigns/lookup-options');
      lookup = lk.success ? lk.data : lookup;
      selectedGoalId = selectedGoalId || lookup.goals?.[0]?.id || null;
      selectedPromoId = selectedPromoId || lookup.promotionTypes?.[0]?.id || null;

      await reloadProjectData();
    }

    async function reloadProjectData() {
      const [ca, camp, tl] = await Promise.all([
        apiGet(`/api/channel-accounts/projects/${projectId}`),
        apiGet(`/api/campaigns/projects/${projectId}`),
        apiGet(`/api/timelines/projects/${projectId}`)
      ]);
      channelAccounts = ca.success ? ca.data : [];
      campaigns = camp.success ? camp.data : [];
      timelines = tl.success ? tl.data : [];
      renderPage();
    }

    function changeProject(id) {
      projectId = id;
      reloadProjectData();
    }

    function renderPage() {
      setPageContent(`
        <div class="data-card" style="padding:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
            <h3 style="font-size:1.1rem;"><i class="bi bi-lightning-charge" style="color:#6156f4"></i> Kế hoạch nội dung</h3>
            <select class="form-control" style="min-width:240px" onchange="changeProject(this.value)">
              ${projects.map(p => `<option value="${p.id}" ${p.id === projectId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('')}
            </select>
          </div>

          <div class="form-group">
            <label>Mục tiêu chiến dịch</label>
            <div class="action-bar">
              ${(lookup.goals || []).map(g => `
                <button class="${g.id === selectedGoalId ? 'btn-primary' : 'btn-outline'} btn-sm" onclick="selectGoal('${g.id}')">${escapeHtml(g.name)}</button>
              `).join('')}
            </div>
          </div>

          <div class="form-group">
            <label>Loại ưu đãi</label>
            <div class="action-bar">
              ${(lookup.promotionTypes || []).map(t => `
                <button class="${t.id === selectedPromoId ? 'btn-primary' : 'btn-outline'} btn-sm" onclick="selectPromo('${t.id}')">${escapeHtml(t.name)}</button>
              `).join('')}
            </div>
          </div>

          <div class="form-row">
            <div class="form-group"><label>Tên chiến dịch</label><input id="campName" class="form-control" placeholder="VD: Ra mắt BST Hè 2025" /></div>
            <div class="form-group"><label>Số bài đăng</label><input id="campPosts" type="number" min="1" value="5" class="form-control" /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Giảm (%)</label><input id="campDiscountPercent" type="number" class="form-control" placeholder="VD: 20" /></div>
            <div class="form-group"><label>Đơn tối thiểu (VNĐ)</label><input id="campMinOrder" type="number" class="form-control" placeholder="VD: 300000" /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Bắt đầu</label><input id="campStart" type="date" class="form-control" /></div>
            <div class="form-group"><label>Kết thúc</label><input id="campEnd" type="date" class="form-control" /></div>
          </div>

          <div class="form-group">
            <label>Nền tảng áp dụng</label>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
              ${channelAccounts.length ? channelAccounts.map(c => `
                <button type="button" class="${selectedChannelIds.includes(c.id) ? 'btn-primary' : 'btn-outline'} btn-sm" onclick="toggleChannel('${c.id}')">
                  ${escapeHtml(c.channelName)} — ${escapeHtml(c.name)}
                </button>
              `).join('') : '<span style="font-size:.85rem;color:#8f95aa;">Chưa có kênh nào — thêm ở trang Brand Memory (mục Kênh bán hàng).</span>'}
            </div>
          </div>

          <button class="btn-primary" style="margin-top:10px;" onclick="createCampaign()"><i class="bi bi-plus"></i> Tạo chiến dịch</button>
        </div>

        <div class="data-card" style="padding:14px;">
          <h3 style="font-size:1.02rem;margin-bottom:10px;">Chiến dịch hiện có (${campaigns.length})</h3>
          ${renderCampaignList()}
        </div>

        <p style="margin:16px 0 10px;">Chọn mẫu timeline phù hợp — bắt đầu nhanh với các mẫu được thiết kế sẵn.</p>
        <div style="display:grid;grid-template-columns:1fr;gap:12px;">
          ${(lookup.timelineTemplateTypes || []).map(renderTemplateCard).join('')}
        </div>

        <div class="data-card" style="padding:14px;margin-top:12px;">
          <h3 style="font-size:1.02rem;margin-bottom:10px;">Timeline hiện có (${timelines.length})</h3>
          ${renderTimelineList()}
        </div>
      `);
    }

    function renderCampaignList() {
      if (!campaigns.length) return '<div class="empty-state">Chưa có chiến dịch nào.</div>';
      return `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;">
          ${campaigns.map(c => `
            <article style="border:1px solid #e7eaf6;border-radius:12px;padding:12px;background:#fff;">
              <div style="font-weight:700;margin-bottom:4px;">${escapeHtml(c.name)}</div>
              <div style="font-size:.8rem;color:#8f95aa;margin-bottom:6px;">${escapeHtml(c.goalName)} • ${escapeHtml(c.promotionTypeName)}</div>
              <div style="font-size:.78rem;color:#8f95aa;">${c.startDate} → ${c.endDate} • ${c.numberOfPosts} bài</div>
            </article>
          `).join('')}
        </div>
      `;
    }

    function renderTemplateCard(t) {
      return `
        <div class="data-card" style="padding:14px;">
          <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px;align-items:center;">
            <div style="border:1px dashed #dce1f3;border-radius:12px;padding:14px;background:#fbfcff;font-size:.82rem;color:#8f95aa;">
              ${escapeHtml(t.description || t.name)}
            </div>
            <div>
              <h3 style="margin:0 0 6px;">${escapeHtml(t.name)}</h3>
              <button class="btn-primary btn-sm" onclick="showCreateTimeline('${t.id}', '${escapeHtml(t.name)}')">Sử dụng mẫu</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderTimelineList() {
      if (!timelines.length) return '<div class="empty-state">Chưa có timeline nào.</div>';
      return `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;">
          ${timelines.map(t => `
            <article style="border:1px solid #e7eaf6;border-radius:12px;padding:12px;background:#fff;">
              <div style="font-weight:700;">${escapeHtml(t.name)}</div>
              <div style="font-size:.78rem;color:#8f95aa;margin:4px 0;">${escapeHtml(t.templateTypeName)} • ${t.startDate} → ${t.endDate}</div>
              <div style="font-size:.78rem;color:#8f95aa;">${t.postCount} bài viết</div>
              <div class="action-bar" style="margin-top:8px;">
                <a class="btn-outline btn-sm" href="/app/posts.html?timelineId=${t.id}&projectId=${projectId}">Xem bài viết</a>
                <button class="btn-primary btn-sm" onclick="generateTimelinePosts('${t.id}')"><i class="bi bi-stars"></i> AI sinh bài viết mẫu</button>
              </div>
            </article>
          `).join('')}
        </div>
      `;
    }

    async function generateTimelinePosts(timelineId) {
      showModal('AI sinh bài viết mẫu', `
        <div class="form-group">
          <label>Số bài viết muốn tạo (để trống = tự động theo chiến dịch hoặc mặc định 5)</label>
          <input id="genCount" type="number" min="1" max="30" class="form-control" placeholder="VD: 5" />
        </div>
        <div class="form-group">
          <label>Nhà cung cấp AI</label>
          <select id="genProvider" class="form-control">
            <option value="2">Claude</option>
            <option value="0">ChatGPT (OpenAI)</option>
            <option value="1">Gemini</option>
          </select>
        </div>
        <p style="font-size:.8rem;color:#8f95aa;">AI sẽ tạo các bài viết NHÁP dựa trên mục tiêu chiến dịch và Brand Memory — bạn xem lại/chỉnh sửa trước khi đăng.</p>
      `, `
        <button class="btn-outline btn-sm" onclick="closeModal()">Hủy</button>
        <button class="btn-primary btn-sm" id="doGenerate">Tạo bằng AI</button>
      `);
      document.getElementById('doGenerate')?.addEventListener('click', async () => {
        const postCount = document.getElementById('genCount').value ? Number(document.getElementById('genCount').value) : null;
        const provider = Number(document.getElementById('genProvider').value);
        closeModal();
        showToast('AI đang tạo bài viết mẫu — có thể mất vài chục giây...', 'info');
        const json = await apiPost(`/api/timelines/${timelineId}/generate-posts`, { provider, postCount });
        if (json.success) {
          showToast(`AI đã tạo ${json.data.posts.length} bài viết nháp. Vào "Xem bài viết" để chỉnh sửa.`, 'success');
          await reloadProjectData();
        } else {
          showToast(json.message || (json.errors || []).join(', ') || 'AI sinh nội dung thất bại — kiểm tra API key trong appsettings.', 'error');
        }
      });
    }

    function selectGoal(id) { selectedGoalId = id; renderPage(); }
    function selectPromo(id) { selectedPromoId = id; renderPage(); }
    function toggleChannel(id) {
      const i = selectedChannelIds.indexOf(id);
      i >= 0 ? selectedChannelIds.splice(i, 1) : selectedChannelIds.push(id);
      renderPage();
    }

    async function createCampaign() {
      const name = document.getElementById('campName').value.trim();
      const start = document.getElementById('campStart').value;
      const end = document.getElementById('campEnd').value;
      if (!name) return showToast('Nhập tên chiến dịch', 'error');
      if (!selectedGoalId || !selectedPromoId) return showToast('Chọn mục tiêu và loại ưu đãi', 'error');
      if (!start || !end) return showToast('Chọn ngày bắt đầu/kết thúc', 'error');

      const payload = {
        name,
        goalId: selectedGoalId,
        promotionTypeId: selectedPromoId,
        discountPercent: document.getElementById('campDiscountPercent').value ? Number(document.getElementById('campDiscountPercent').value) : null,
        minOrderAmount: document.getElementById('campMinOrder').value ? Number(document.getElementById('campMinOrder').value) : null,
        startDate: start,
        endDate: end,
        numberOfPosts: Number(document.getElementById('campPosts').value || 1),
        channelAccountIds: selectedChannelIds
      };

      const json = await apiPost(`/api/campaigns/projects/${projectId}`, payload);
      if (json.success) {
        showToast('Đã tạo chiến dịch', 'success');
        await reloadProjectData();
      } else {
        showToast(json.message || (json.errors || []).join(', ') || 'Không tạo được chiến dịch', 'error');
      }
    }

    function showCreateTimeline(templateTypeId, templateName) {
      const campaignOptions = campaigns.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
      showModal(`Tạo timeline — ${templateName}`, `
        <div class="form-group"><label>Tên timeline</label><input id="tlName" class="form-control" placeholder="VD: Timeline: Ra mắt BST Hè 2025" /></div>
        <div class="form-group">
          <label>Gắn với chiến dịch (không bắt buộc)</label>
          <select id="tlCampaign" class="form-control">
            <option value="">- Không gắn chiến dịch -</option>
            ${campaignOptions}
          </select>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Bắt đầu</label><input id="tlStart" type="date" class="form-control" /></div>
          <div class="form-group"><label>Kết thúc</label><input id="tlEnd" type="date" class="form-control" /></div>
        </div>
      `, `
        <button class="btn-outline btn-sm" onclick="closeModal()">Hủy</button>
        <button class="btn-primary btn-sm" id="saveTl">Tạo timeline</button>
      `);
      document.getElementById('saveTl')?.addEventListener('click', async () => {
        const name = document.getElementById('tlName').value.trim();
        const startDate = document.getElementById('tlStart').value;
        const endDate = document.getElementById('tlEnd').value;
        if (!name || !startDate || !endDate) return showToast('Nhập đủ tên và khoảng thời gian', 'error');
        const json = await apiPost(`/api/timelines/projects/${projectId}`, {
          campaignId: document.getElementById('tlCampaign').value || null,
          name, templateTypeId, startDate, endDate
        });
        closeModal();
        if (json.success) {
          showToast('Đã tạo timeline', 'success');
          await reloadProjectData();
        } else {
          showToast(json.message || 'Không tạo được timeline', 'error');
        }
      });
    }

    loadAll();
  </script>
</body>
</html>
